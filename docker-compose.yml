# Docker Compose configuration for StudyBot

version: '3.8'

services:
  studybot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: studybot-app
    ports:
      - "8501:8501"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    volumes:
      # Persist data between container restarts
      - ./data:/app/data
      # Mount secrets (for local development)
      - ./.streamlit/secrets.toml:/app/.streamlit/secrets.toml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - studybot-network

networks:
  studybot-network:
    driver: bridge

volumes:
  studybot-data:
